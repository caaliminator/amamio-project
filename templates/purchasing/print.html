{% extends "base.html" %}
{% block title %}PO {{ po.po_no }}{% endblock %}
{% block content %}
<a class="back-link no-print" href="{{ url_for('purchasing.detail', po_id=po.id) }}">{{ icon('arrow-left', 15) }} PO {{ po.po_no }}</a>
<div class="filter-bar no-print">
  <span class="muted small">Purchase Order · {{ po.status }}{% if po.status == 'Prepared' %} — not yet approved{% endif %}</span>
  <button class="btn btn-primary" type="button" onclick="window.print()">{{ icon('printer', 15) }} Print</button>
</div>

{% include "purchasing/_document.html" %}
{% endblock %}
